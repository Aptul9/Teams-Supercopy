name: Chrome Web Store

on:
  pull_request:
    paths:
      - 'browser-extension/**'
      - 'tests/**'
      - 'tools/chrome-web-store.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chrome-web-store.yml'
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - 'tools/chrome-web-store.mjs'
      - '.github/workflows/chrome-web-store.yml'
  workflow_dispatch:
    inputs:
      verify_auth:
        description: Check Google authentication only, without uploading
        type: boolean
        default: true
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read

concurrency:
  group: chrome-web-store-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'schedule' || vars.CWS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Stage package
        id: package
        run: node tools/chrome-web-store.mjs package
      - name: Zip extension root
        working-directory: .release/extension
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -q -X -D "../Teams Supercopy ${RELEASE_VERSION}.zip" -@
          unzip -l "../Teams Supercopy ${RELEASE_VERSION}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-web-store-package
          path: .release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.CWS_PUBLISH_ENABLED == 'true' || inputs.verify_auth == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-web-store-package
          path: .release
      - name: Authenticate without a stored key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify temporary Google token
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: node tools/chrome-web-store.mjs verify-auth
      - name: Submit and report store state
        if: inputs.verify_auth != true && vars.CWS_PUBLISH_ENABLED == 'true'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: node tools/chrome-web-store.mjs publish
